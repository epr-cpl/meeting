<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>아보카도 오퍼레이션팀 회의록</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

  :root{
    --bg:#F2F4F0;
    --surface:#FFFFFF;
    --ink:#141F18;
    --ink-soft:#495A4F;
    --ink-faint:#8A968B;
    --line:#D9E0D6;
    --line-soft:#E9EEE6;
    --accent-epr:#0E8A63;
    --accent-vat:#CE7A0A;
    --accent-etc:#6942C4;
    --accent-x1:#1F6FB8;
    --accent-x2:#B33D63;
    --accent-x3:#7A8B1E;
    --danger:#B2382A;
    --danger-bg:#F6E1DE;
    --success:#187A45;
    --success-bg:#DFF0E5;
    --today:#CE7A0A;
    --radius:12px;
    --shadow:0 1px 2px rgba(20,31,24,0.07), 0 6px 20px rgba(20,31,24,0.06);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  .app{max-width:960px; margin:0 auto; padding:28px 20px 90px;}

  /* ---------- Header ---------- */
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:20px;}
  .brand{display:flex; align-items:center; gap:12px; cursor:pointer;}
  .brand-mark{width:34px; height:34px; flex:0 0 auto;}
  .brand h1{font-size:18px; font-weight:800; margin:0; letter-spacing:-0.01em;}

  .btn{
    font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer;
    border-radius:9px; border:1px solid transparent; padding:9px 14px;
    transition:transform .08s ease, background .15s ease, border-color .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-primary:hover{background:#0A140F;}
  .btn-ghost{background:transparent; color:var(--ink-soft); border-color:var(--line);}
  .btn-ghost:hover{border-color:var(--ink-faint); color:var(--ink);}
  .btn-danger{background:transparent; color:var(--danger); border-color:var(--danger-bg);}
  .btn-danger:hover{background:var(--danger-bg);}
  .btn-sm{padding:6px 11px; font-size:12.5px;}

  /* ---------- Home mode toggle ---------- */
  .mode-toggle{display:flex; gap:4px; background:var(--line-soft); padding:3px; border-radius:10px; width:fit-content; margin-bottom:18px;}
  .mode-toggle button{
    font-family:inherit; font-size:13px; font-weight:700; border:none; background:transparent;
    color:var(--ink-soft); padding:7px 16px; border-radius:8px; cursor:pointer;
  }
  .mode-toggle button.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}

  .home-actions{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
  .add-meeting-row{display:flex; gap:8px; align-items:center;}
  .add-meeting-row input[type="date"], .add-meeting-row input[type="time"]{
    font-family:'Pretendard'; font-size:13px; border:1px solid var(--line); border-radius:8px; padding:8px 10px;
  }
  .meeting-title-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:4px 0 20px;}
  .meeting-title-row .meeting-title{margin:0;}
  .meeting-time-inline{display:inline-flex; align-items:center; gap:6px; white-space:nowrap;}
  .meeting-time-inline .clock-ico{font-size:13px;}
  .meeting-time-inline input[type="time"]{
    font-family:'Pretendard'; font-size:13px; border:1px solid var(--line); border-radius:8px; padding:5px 8px;
  }

  /* ---------- Meeting-wide memo ---------- */
  .notes-section{background:#FCF8EC; border:1.5px solid #EBDCA6; border-radius:var(--radius); margin-bottom:18px; overflow:hidden;}
  .notes-toggle-btn{
    width:100%; display:flex; align-items:center; gap:8px; background:none; border:none; cursor:pointer;
    padding:12px 16px; font-family:inherit; font-size:13.5px; font-weight:700; color:var(--ink);
  }
  .notes-toggle-btn .chevron{margin-left:auto; transition:transform .15s ease; color:var(--ink-soft);}
  .notes-toggle-btn.collapsed .chevron{transform:rotate(-90deg);}
  .notes-count{font-size:11px; font-weight:700; color:var(--ink-faint); margin-left:2px;}
  .notes-body{padding:0 16px 16px;}
  .notes-body.collapsed{display:none;}
  .notes-editor{min-height:70px; background:#FFFDF6;}
  .notes-section .thread-list{margin-bottom:12px;}
  .notes-thread-list:empty{margin-bottom:0;}
  .notes-thread-list .thread-empty{padding:14px 4px; font-size:12.5px;}

  /* ---------- Meeting table ---------- */
  .meeting-list{display:flex; flex-direction:column; gap:8px;}
  .meeting-row{
    display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--line-soft);
    border-radius:var(--radius); padding:14px 16px; cursor:pointer; box-shadow:var(--shadow);
  }
  .meeting-row:hover{box-shadow:0 2px 6px rgba(20,31,24,0.10), 0 10px 26px rgba(20,31,24,0.09);}
  .meeting-date{font-size:15px; font-weight:800; min-width:150px;}
  .meeting-flag{font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; background:var(--today); color:#fff;}
  .meeting-count{margin-left:auto; font-size:12.5px; color:var(--ink-soft); font-weight:600;}
  .meeting-avatars{display:flex; margin-left:10px;}
  .mini-avatar{
    width:22px; height:22px; border-radius:50%; background:var(--ink); color:#fff; font-size:10px; font-weight:700;
    display:flex; align-items:center; justify-content:center; border:2px solid var(--surface); margin-left:-7px;
  }
  .meeting-empty-note{font-size:12px; color:var(--ink-faint); margin-left:10px;}

  /* ---------- Calendar ---------- */
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .cal-head h2{font-size:16px; font-weight:800; margin:0;}
  .cal-nav{display:flex; gap:4px;}
  .cal-nav button{
    width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:var(--surface);
    cursor:pointer; font-size:14px; color:var(--ink-soft);
  }
  .cal-nav button:hover{border-color:var(--ink-faint); color:var(--ink);}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-dow{font-size:12px; font-weight:800; color:var(--ink-soft); text-align:center; padding-bottom:4px;}
  .cal-cell{
    aspect-ratio:1/0.85; border-radius:10px; border:1.5px solid var(--line); background:var(--surface);
    padding:6px; cursor:pointer; display:flex; flex-direction:column; gap:4px; position:relative;
  }
  .cal-cell.out{opacity:0.4;}
  .cal-cell:hover{border-color:var(--ink-faint);}
  .cal-cell.has-meeting{border:2px solid var(--accent-epr); background:#CDEEDC;}
  .cal-cell.has-meeting .cal-daynum{color:#0E6B4C; font-weight:800;}
  .cal-cell.is-today{outline:3px solid var(--today); outline-offset:-2px;}
  .cal-daynum{font-size:13px; font-weight:700; color:var(--ink);}
  .cal-cell.sun .cal-daynum{color:var(--danger);}
  .cal-cell.sat .cal-daynum{color:var(--accent-x1);}
  .cal-cell.holiday .cal-daynum{color:var(--danger);}
  .cal-holiday-name{font-size:9px; font-weight:700; color:var(--danger); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.2;}
  .cal-dow:nth-child(1){color:var(--danger);}
  .cal-dow:nth-child(7){color:var(--accent-x1);}
  .cal-count{
    font-size:10.5px; font-weight:800; color:#fff; background:var(--accent-epr); border-radius:20px;
    padding:1.5px 7px; align-self:flex-start; box-shadow:0 1px 2px rgba(14,138,99,0.35);
  }

  /* ---------- Meeting detail ---------- */
  .meeting-header{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .back-btn{
    display:flex; align-items:center; gap:4px; font-size:13px; font-weight:700; color:var(--ink-soft);
    background:none; border:none; cursor:pointer; padding:6px 8px 6px 0;
  }
  .back-btn:hover{color:var(--ink);}
  .meeting-title{font-size:20px; font-weight:800; margin:4px 0 20px;}

  .toolbar{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:18px;}
  .tabs{display:flex; gap:6px; flex-wrap:wrap;}
  .tab{
    font-size:12.5px; font-weight:700; padding:7px 12px; border-radius:20px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); cursor:pointer; white-space:nowrap;
  }
  .tab.on{background:var(--ink); color:#fff; border-color:var(--ink);}
  .toolbar-right{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  select, .chk{
    font-family:inherit; font-size:12.5px; color:var(--ink-soft); border:1px solid var(--line);
    background:var(--surface); border-radius:8px; padding:7px 10px; cursor:pointer;
  }
  .chk{display:flex; align-items:center; gap:6px; user-select:none;}
  .chk input{accent-color:var(--ink);}

  /* ---------- Issue list (rows) ---------- */
  .list{display:flex; flex-direction:column; gap:8px;}
  .row{
    display:flex; background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;
    cursor:pointer; border:1px solid var(--line-soft); transition:box-shadow .15s ease;
  }
  .row:hover{box-shadow:0 2px 6px rgba(20,31,24,0.10), 0 10px 26px rgba(20,31,24,0.09);}
  .row-bar{width:4px; flex:0 0 auto;}
  .row-main{flex:1 1 auto; padding:14px 16px; min-width:0;}
  .tag{font-size:11px; font-weight:800; padding:3px 9px; border-radius:20px; letter-spacing:0.01em;}
  .status{font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px;}
  .status-waiting{background:var(--line-soft); color:var(--ink-soft);}
  .status-inprogress{background:#E5EEF8; color:var(--accent-x1);}
  .status-overdue{background:var(--danger-bg); color:var(--danger);}
  .status-done{background:var(--success-bg); color:var(--success);}
  .row-meta{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft); font-weight:500;}
  .avatar{
    width:20px; height:20px; border-radius:50%; background:var(--ink); color:#fff; font-size:10px; font-weight:800;
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .row-dates{width:210px; flex:0 0 auto; padding:14px 16px 14px 0; display:flex; flex-direction:column; justify-content:center; gap:6px;}
  .rail{position:relative; height:6px; background:var(--line-soft); border-radius:4px; overflow:visible;}
  .rail-fill{position:absolute; top:0; left:0; height:100%; border-radius:4px;}
  .rail-today{position:absolute; top:-3px; width:2px; height:12px; background:var(--ink); border-radius:2px; transform:translateX(-1px);}
  .date-labels{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-faint); font-weight:600;}
  .done-date{font-size:11px; color:var(--success); font-weight:700; text-align:right;}

  .empty{text-align:center; padding:60px 20px; color:var(--ink-soft);}
  .empty p{font-size:14px; margin:0 0 16px; font-weight:500;}

  /* ---------- Toggle-row (card) mode ---------- */
  .row.toggle-row{cursor:default; flex-direction:column;}
  .row.toggle-row .row-summary{display:flex; align-items:center; gap:10px; padding:13px 16px; cursor:pointer;}
  .row-summary-detail{
    flex:1 1 auto; font-size:14px; font-weight:600; margin:0; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .row-summary-assignee{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft); flex:0 0 auto;}
  .thread-count-pill{font-size:11px; font-weight:700; color:var(--ink-faint); flex:0 0 auto;}
  .chevron{color:var(--ink-faint); font-size:12px; flex:0 0 auto; transition:transform .15s ease;}
  .row.toggle-row.expanded .chevron{transform:rotate(90deg);}
  .row-expand{display:none; padding:0 16px 16px; border-top:1px solid var(--line-soft);}
  .row.toggle-row.expanded .row-expand{display:block; padding-top:12px;}
  .row-expand-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:10px;}
  .row-expand-actions button{
    font-size:12px; font-weight:700; padding:6px 12px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-soft); cursor:pointer;
  }
  .row-expand-actions button:hover{border-color:var(--ink-faint); color:var(--ink);}
  .row-expand-actions button.primary-ish{background:var(--ink); color:#fff; border-color:var(--ink);}

  .issue-table{width:100%; border-collapse:collapse; background:var(--surface); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}
  .issue-table th{
    text-align:left; font-size:11.5px; font-weight:800; color:var(--ink-soft); text-transform:uppercase;
    letter-spacing:0.03em; padding:10px 12px; border-bottom:1px solid var(--line-soft); background:var(--line-soft);
  }
  .issue-table td{padding:11px 12px; font-size:13px; border-bottom:1px solid var(--line-soft); vertical-align:middle;}
  .issue-table tbody tr{cursor:pointer;}
  .issue-table tbody tr:hover{background:#F7F9F6;}
  .issue-table tbody tr:last-child td{border-bottom:none;}
  .issue-table .detail-cell{max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600;}

  /* ---------- Drawer (issue meta only) ---------- */
  .scrim{position:fixed; inset:0; background:rgba(15,22,17,0.35); opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:20;}
  .scrim.on{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; right:0; height:100%; width:400px; max-width:92vw; background:var(--surface);
    box-shadow:-8px 0 30px rgba(15,22,17,0.14); transform:translateX(100%); transition:transform .25s ease;
    z-index:21; display:flex; flex-direction:column;
  }
  .drawer.on{transform:translateX(0);}
  .drawer-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--line-soft);}
  .drawer-head h2{font-size:16px; margin:0; font-weight:800;}
  .icon-btn{background:none; border:none; cursor:pointer; font-size:16px; color:var(--ink-soft); width:28px; height:28px; border-radius:8px;}
  .icon-btn:hover{background:var(--line-soft);}
  .drawer-body{padding:18px 20px; overflow-y:auto; flex:1 1 auto;}
  .drawer-body label{display:block; font-size:12px; font-weight:800; color:var(--ink-soft); margin:18px 0 8px; letter-spacing:0.01em;}
  .drawer-body label:first-child{margin-top:0;}
  .cat-picker{display:flex; flex-wrap:wrap; gap:6px;}
  .cat-pill{font-size:12.5px; font-weight:700; padding:7px 12px; border-radius:20px; border:1.5px solid var(--line); background:var(--surface); cursor:pointer; color:var(--ink-soft);}
  .cat-pill.on{color:#fff; border-color:transparent;}
  .add-row{display:flex; gap:6px; margin-top:8px;}
  .add-row input{flex:1;}
  .add-row button{font-size:12px; font-weight:700; padding:0 12px; border-radius:8px; border:1px solid var(--line); background:var(--surface); cursor:pointer; color:var(--ink-soft);}
  input[type="text"], textarea, input[type="date"], input[type="time"]{
    width:100%; font-family:inherit; font-size:13.5px; color:var(--ink); border:1px solid var(--line);
    border-radius:9px; padding:10px 12px; background:var(--surface);
  }
  input:focus, textarea:focus, select:focus{outline:2px solid var(--ink); outline-offset:1px;}
  .date-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .date-grid > div label{margin:0 0 6px; font-size:11px;}
  .date-grid input{font-size:12px; padding:9px 8px;}

  .drawer-foot{display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-top:1px solid var(--line-soft); gap:8px;}
  .foot-right{display:flex; gap:8px;}

  .status-pill-대기{background:#E7E9E4 !important; color:var(--ink-soft) !important; border-color:transparent !important;}
  .status-pill-진행중{background:var(--accent-x1) !important; color:#fff !important; border-color:transparent !important;}
  .status-pill-완료{background:var(--success) !important; color:#fff !important; border-color:transparent !important;}

  /* ---------- Rich text editors (shared) ---------- */
  .rte-toolbar{display:flex; gap:5px; margin-bottom:6px; flex-wrap:wrap; align-items:center;}
  .rte-toolbar button{
    font-family:inherit; font-size:12px; font-weight:700; padding:5px 9px; border-radius:8px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); cursor:pointer;
  }
  .rte-toolbar button:hover{border-color:var(--ink-faint); color:var(--ink);}
  .rte-sep{width:1px; height:18px; background:var(--line); margin:0 2px;}
  .rte-editor{
    min-height:110px; max-height:320px; overflow-y:auto; border:1px solid var(--line); border-radius:9px;
    padding:12px; font-size:13.5px; line-height:1.6; color:var(--ink); background:var(--surface);
  }
  .rte-editor:focus{outline:2px solid var(--ink); outline-offset:1px;}
  .rte-editor ul, .rte-content ul{margin:4px 0; padding-left:20px;}
  .rte-editor ol, .rte-content ol{margin:4px 0; padding-left:20px;}
  .rte-editor:empty::before{content:attr(data-placeholder); color:var(--ink-faint);}
  .rte-content{font-size:13.5px; line-height:1.6; color:var(--ink);}
  .rte-editor blockquote, .rte-content blockquote{
    border-left:3px solid var(--accent-x1); margin:6px 0; padding:2px 12px; color:var(--ink-soft); font-style:italic;
  }
  .rte-editor code, .rte-content code{
    background:var(--line-soft); padding:1px 6px; border-radius:4px; font-family:'IBM Plex Mono', monospace; font-size:0.9em;
  }
  .rte-editor pre, .rte-content pre{
    background:#1E241F; color:#E7EEE9; padding:10px 12px; border-radius:8px; overflow-x:auto;
    font-family:'IBM Plex Mono', monospace; font-size:12.5px; margin:6px 0; white-space:pre-wrap;
  }
  .rte-editor pre code, .rte-content pre code{background:none; padding:0; color:inherit;}
  .rte-editor a, .rte-content a{color:var(--accent-x1); text-decoration:underline;}

  /* ---------- Thread view ---------- */
  .thread-head{background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius); padding:18px 20px; margin-bottom:16px; box-shadow:var(--shadow);}
  .thread-head-top{display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
  .thread-head-top .status{cursor:pointer;}
  .thread-head-spacer{flex:1;}
  .thread-title{font-size:19px; font-weight:800; margin:0 0 12px; line-height:1.4;}
  .thread-meta-row{display:flex; flex-wrap:wrap; gap:16px; font-size:12.5px; color:var(--ink-soft); margin-bottom:10px;}
  .thread-meta-item{display:flex; align-items:center; gap:6px;}
  .thread-meta-item .avatar{width:18px; height:18px; font-size:9px;}
  .thread-linked-meetings{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:12px; color:var(--ink-faint);}
  .thread-linked-meetings .chip{
    font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:20px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-soft); cursor:pointer;
  }
  .thread-linked-meetings .chip:hover{border-color:var(--ink-faint); color:var(--ink);}
  .thread-linked-meetings .chip.current{background:var(--ink); color:#fff; border-color:var(--ink);}

  .thread-list{display:flex; flex-direction:column; gap:10px; margin-bottom:18px;}
  .thread-entry{background:var(--surface); border:1px solid var(--line-soft); border-radius:10px; padding:12px 14px; box-shadow:var(--shadow);}
  .thread-entry-head{display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:11.5px; color:var(--ink-faint); font-weight:700;}
  .thread-entry-head .meeting-tag{color:var(--accent-epr);}
  .thread-entry-head .del-entry{margin-left:auto; background:none; border:none; cursor:pointer; color:var(--ink-faint); font-size:13px; padding:2px 4px;}
  .thread-entry-head .del-entry:hover{color:var(--danger);}
  .thread-entry-body{font-size:13.5px; line-height:1.6; color:var(--ink);}
  .thread-empty{text-align:center; padding:36px 10px; color:var(--ink-faint); font-size:13px;}

  .thread-composer{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow);}
  .thread-composer-foot{display:flex; justify-content:flex-end; gap:8px; margin-top:8px;}
  .thread-entry-head .edited-label{color:var(--ink-faint); font-weight:600; font-style:italic;}
  .thread-entry-head .edit-entry{background:none; border:none; cursor:pointer; color:var(--ink-faint); font-size:13px; padding:2px 4px;}
  .thread-entry-head .edit-entry:hover{color:var(--ink);}

  /* ---------- Link-existing-issue panel ---------- */
  .link-panel-list{display:flex; flex-direction:column; gap:8px;}
  .link-panel-item{display:flex; align-items:center; gap:10px; border:1px solid var(--line-soft); border-radius:10px; padding:10px 12px;}
  .link-panel-item .info{flex:1; min-width:0;}
  .link-panel-item .info .t{font-size:13.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  const supabase = window.supabase.createClient(
    'https://imrdgliihqruohwihrpf.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImltcmRnbGlpaHFydW9od2locnBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MzIxNTAsImV4cCI6MjEwMjAwODE1MH0.AT9PB_VHn3PSsHg4-T1Oygx_caMeOtN3Pgx2vx-r0uw'
  );

  async function getVal(key){
    const { data, error } = await supabase.from('kv_store').select('value').eq('key', key).maybeSingle();
    if(error){ console.error('supabase get error', key, '-', error.message, '| code:', error.code, '| details:', error.details, '| hint:', error.hint); return null; }
    return data ? data.value : null;
  }
  async function setVal(key, value){
    const { error } = await supabase.from('kv_store').upsert({ key, value, updated_at: new Date().toISOString() });
    if(error) console.error('supabase set error', key, '-', error.message, '| code:', error.code, '| details:', error.details, '| hint:', error.hint);
  }

  const rootStyle = getComputedStyle(document.documentElement);

  const DEFAULT_CATEGORIES = [
    {id:'epr', name:'EPR', color: rootStyle.getPropertyValue('--accent-epr').trim()},
    {id:'vat', name:'VAT', color: rootStyle.getPropertyValue('--accent-vat').trim()},
    {id:'etc', name:'기타', color: rootStyle.getPropertyValue('--accent-etc').trim()},
  ];
  const STATUSES = ['대기', '진행중', '완료'];

  let state = {
    issues: [],
    categories: DEFAULT_CATEGORIES,
    assignees: [],
    meetings: [],
    meetingTimes: {},
    meetingNotes: {},
    view: 'home',
    homeMode: 'table',
    calYear: new Date().getFullYear(),
    calMonth: new Date().getMonth(),
    currentMeeting: null,
    currentIssueId: null,
    filterCat: 'all',
    filterAssignee: 'all',
    hideDone: false,
    sort: 'due-asc',
    itemMode: 'toggle',
    expandedIds: new Set(),
  };

  let editingId = null;
  let pickedCategoryId = null;
  let pickedAssignees = [];
  let pickedStatus = '대기';

  const $ = (sel) => document.querySelector(sel);
  const WEEKDAYS = ['일','월','화','수','목','금','토'];

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function pad(n){ return String(n).padStart(2,'0'); }
  function toISO(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
  function todayISO(){ return toISO(new Date()); }
  function fmtShort(s){ if(!s) return '—'; const [,m,d] = s.split('-'); return `${m}.${d}`; }
  function fmtLong(s){
    if(!s) return '';
    const d = new Date(s + 'T00:00:00');
    return `${d.getMonth()+1}월 ${d.getDate()}일 (${WEEKDAYS[d.getDay()]})`;
  }
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function initials(name){ if(!name) return '?'; return name.trim().slice(-2) || '?'; }
  function assigneeText(list){ return (list && list.length) ? list.join(', ') : '담당자 미지정'; }
  function assigneeAvatars(list){
    if(!list || !list.length) return `<span class="avatar">?</span>`;
    const shown = list.slice(0,2).map(n => `<span class="avatar">${escapeHtml(initials(n))}</span>`).join('');
    const extra = list.length > 2 ? `<span class="avatar">+${list.length-2}</span>` : '';
    return shown + extra;
  }
  function htmlToPlainText(html){
    const d = document.createElement('div');
    d.innerHTML = html || '';
    return (d.textContent || '').trim();
  }

  // ---- Holidays (DE + KR) ----
  function easterSunday(year){
    const a = year % 19, b = Math.floor(year/100), c = year % 100;
    const d = Math.floor(b/4), e = b % 4, f = Math.floor((b+8)/25);
    const g = Math.floor((b-f+1)/3), h = (19*a+b-d-g+15)%30;
    const i = Math.floor(c/4), k = c % 4;
    const l = (32+2*e+2*i-h-k)%7;
    const m = Math.floor((a+11*h+22*l)/451);
    const month = Math.floor((h+l-7*m+114)/31);
    const day = ((h+l-7*m+114)%31)+1;
    return new Date(year, month-1, day);
  }
  function addDays(date, n){ const d = new Date(date); d.setDate(d.getDate()+n); return d; }

  const KR_LUNAR_HOLIDAYS = {
    2025: [['01-28','설날 연휴'],['01-29','설날'],['01-30','설날 연휴'],['10-05','추석 연휴'],['10-06','추석'],['10-07','추석 연휴']],
    2026: [['02-16','설날 연휴'],['02-17','설날'],['02-18','설날 연휴'],['09-24','추석 연휴'],['09-25','추석'],['09-26','추석 연휴']],
    2027: [['02-06','설날 연휴'],['02-07','설날'],['02-08','설날 연휴'],['09-14','추석 연휴'],['09-15','추석'],['09-16','추석 연휴']],
  };

  const holidayCache = {};
  function holidaysForYear(year){
    if(holidayCache[year]) return holidayCache[year];
    const map = {};
    const add = (iso, country, name) => { if(!map[iso]) map[iso] = []; map[iso].push({country, name}); };

    add(`${year}-01-01`, 'DE', '신정');
    add(`${year}-05-01`, 'DE', '노동절');
    add(`${year}-10-03`, 'DE', '독일 통일의 날');
    add(`${year}-12-25`, 'DE', '크리스마스');
    add(`${year}-12-26`, 'DE', '크리스마스 다음날');
    const easter = easterSunday(year);
    add(toISO(addDays(easter, -2)), 'DE', '성금요일');
    add(toISO(addDays(easter, 1)), 'DE', '부활절 월요일');
    add(toISO(addDays(easter, 39)), 'DE', '예수승천일');
    add(toISO(addDays(easter, 50)), 'DE', '성령강림절 월요일');

    add(`${year}-01-01`, 'KR', '신정');
    add(`${year}-03-01`, 'KR', '삼일절');
    add(`${year}-05-05`, 'KR', '어린이날');
    add(`${year}-06-06`, 'KR', '현충일');
    add(`${year}-08-15`, 'KR', '광복절');
    add(`${year}-10-03`, 'KR', '개천절');
    add(`${year}-10-09`, 'KR', '한글날');
    add(`${year}-12-25`, 'KR', '크리스마스');
    (KR_LUNAR_HOLIDAYS[year] || []).forEach(([md, name]) => add(`${year}-${md}`, 'KR', name));

    holidayCache[year] = map;
    return map;
  }
  function holidaysOn(iso){
    const year = parseInt(iso.slice(0,4), 10);
    return holidaysForYear(year)[iso] || [];
  }

  function nextTuesday(){
    const d = new Date();
    const day = d.getDay();
    let diff = (2 - day + 7) % 7;
    if(diff === 0) diff = 0;
    d.setDate(d.getDate() + diff);
    return toISO(d);
  }

  async function loadState(){
    try{ const v = await getVal('issues'); if(v) state.issues = v; }catch(e){ state.issues = []; }
    // ---- migrations ----
    state.issues.forEach(i => { if(!Array.isArray(i.assignees)) i.assignees = i.assignee ? [i.assignee] : []; });
    state.issues.forEach(i => {
      if(!i.title){ i.title = i.detail ? htmlToPlainText(i.detail).slice(0,60) || '(제목 없음)' : '(제목 없음)'; }
      if(!i.status){ i.status = i.doneDate ? '완료' : '대기'; }
      if(!Array.isArray(i.linkedMeetings)){
        i.linkedMeetings = i.meetingDate ? [i.meetingDate] : [];
      }
      if(!Array.isArray(i.thread)){
        i.thread = [];
        if(i.detail) i.thread.push({id: uid(), date: i.meetingDate || i.startDate || todayISO(), meetingDate: i.meetingDate || null, body: i.detail});
        if(i.notes) i.thread.push({id: uid(), date: i.meetingDate || todayISO(), meetingDate: i.meetingDate || null, body: i.notes});
      }
    });

    try{ const v = await getVal('assignees'); if(v) state.assignees = v; }catch(e){ state.assignees = []; }
    try{ const v = await getVal('meetings'); if(v) state.meetings = v; }catch(e){ state.meetings = []; }
    try{ const v = await getVal('meetingTimes'); if(v) state.meetingTimes = v; }catch(e){ state.meetingTimes = {}; }
    try{ const v = await getVal('meetingNotes'); if(v) state.meetingNotes = v; }catch(e){ state.meetingNotes = {}; }
    Object.keys(state.meetingNotes).forEach(date => {
      const val = state.meetingNotes[date];
      if(typeof val === 'string'){
        state.meetingNotes[date] = val.trim() ? [{id: uid(), createdAt: new Date().toISOString(), body: val}] : [];
      } else if(!Array.isArray(val)){
        state.meetingNotes[date] = [];
      }
    });

    const upcoming = nextTuesday();
    let needsSaveMeetings = false, needsSaveTimes = false;
    if(!state.meetings.includes(upcoming)){ state.meetings.push(upcoming); needsSaveMeetings = true; }
    if(!state.meetingTimes[upcoming]){ state.meetingTimes[upcoming] = '10:30'; needsSaveTimes = true; }
    if(needsSaveMeetings) await saveMeetings();
    if(needsSaveTimes) await saveMeetingTimes();

    renderHome();
  }

  async function saveIssues(){ try{ await setVal('issues', state.issues); }catch(e){ console.error(e); } }
  async function saveAssignees(){ try{ await setVal('assignees', state.assignees); }catch(e){ console.error(e); } }
  async function saveMeetings(){ try{ await setVal('meetings', state.meetings); }catch(e){ console.error(e); } }
  async function saveMeetingTimes(){ try{ await setVal('meetingTimes', state.meetingTimes); }catch(e){ console.error(e); } }
  async function saveMeetingNotes(){ try{ await setVal('meetingNotes', state.meetingNotes); }catch(e){ console.error(e); } }

  function categoryById(id){ return state.categories.find(c => c.id === id) || {name:'기타', color:'#8B94A0'}; }

  function getIssuesForMeeting(date){ return state.issues.filter(i => (i.linkedMeetings || []).includes(date)); }
  function allMeetingDates(){
    const set = new Set(state.meetings);
    state.issues.forEach(i => (i.linkedMeetings || []).forEach(d => set.add(d)));
    return Array.from(set).sort().reverse();
  }
  function issueCountFor(date){ return getIssuesForMeeting(date).length; }
  function assigneesFor(date){ return Array.from(new Set(getIssuesForMeeting(date).flatMap(i => i.assignees || []))); }

  // ================= VIEW ROUTING =================
  function showView(name){
    state.view = name;
    $('#homeView').style.display = name === 'home' ? '' : 'none';
    $('#meetingView').style.display = name === 'meeting' ? '' : 'none';
    $('#threadView').style.display = name === 'thread' ? '' : 'none';
  }

  // ================= HOME =================
  function renderHome(){
    showView('home');
    if(state.homeMode === 'table') renderMeetingTable(); else renderCalendar();
  }

  function renderMeetingTable(){
    $('#tableMode').style.display = '';
    $('#calendarMode').style.display = 'none';

    if(dates.length === 0){
      container.innerHTML = `<div class="empty"><p>등록된 회의가 아직 없어요.</p></div>`;
      return;
    }
    container.innerHTML = dates.map(date => {
      const count = issueCountFor(date);
      const names = assigneesFor(date).slice(0,4);
      const isUpcoming = date >= today;
      return `
        <div class="meeting-row" data-date="${date}">
          <span class="meeting-date">${fmtLong(date)}${state.meetingTimes[date] ? ` · ${state.meetingTimes[date]}` : ''}</span>
          ${isUpcoming ? `<span class="meeting-flag">${date === today ? '오늘' : '다가오는 회의'}</span>` : ''}
          ${count === 0 ? `<span class="meeting-empty-note">안건 없음</span>` : `
            <span class="meeting-count">안건 ${count}개</span>
            <span class="meeting-avatars">${names.map(n => `<span class="mini-avatar">${escapeHtml(initials(n))}</span>`).join('')}</span>
          `}
        </div>
      `;
    }).join('');

  function renderCalendar(){
    $('#tableMode').style.display = 'none';
    $('#calendarMode').style.display = '';
    const y = state.calYear, m = state.calMonth;
    $('#calLabel').textContent = `${y}년 ${m+1}월`;

    const first = new Date(y, m, 1);
    const startOffset = first.getDay();
    const gridStart = new Date(y, m, 1 - startOffset);
    const cells = Array.from({length:42}, (_, i) => { const d = new Date(gridStart); d.setDate(gridStart.getDate()+i); return d; });

    const meetingSet = new Set(allMeetingDates());
    const today = todayISO();

    let html = WEEKDAYS.map(w => `<div class="cal-dow">${w}</div>`).join('');
    html += cells.map(d => {
      const iso = toISO(d);
      const out = d.getMonth() !== m;
      const has = meetingSet.has(iso);
      const count = issueCountFor(iso);
      const dow = d.getDay();
      const holidays = holidaysOn(iso);
      const classes = ['cal-cell'];
      if(out) classes.push('out');
      if(has) classes.push('has-meeting');
      if(iso === today) classes.push('is-today');
      if(dow === 0) classes.push('sun');
      if(dow === 6) classes.push('sat');
      if(holidays.length) classes.push('holiday');
      const timeLabel = has && state.meetingTimes[iso] ? ` (${state.meetingTimes[iso]})` : '';
      const holidayTitle = holidays.length ? holidays.map(h => `${h.country === 'DE' ? '독일' : '한국'} · ${h.name}`).join(' / ') : '';
      const titleAttr = (has || holidays.length) ? `title="${escapeHtml([has ? `회의${timeLabel}` : '', holidayTitle].filter(Boolean).join(' | '))}"` : '';
      const holidayLabel = holidays.length ? `<span class="cal-holiday-name">${escapeHtml(holidays[0].name)}${holidays.length>1 ? ' 외' : ''}</span>` : '';
      return `
        <div class="${classes.join(' ')}" data-date="${iso}" ${titleAttr}>
          <span class="cal-daynum">${d.getDate()}</span>
          ${has && count > 0 ? `<span class="cal-count">${count}</span>` : holidayLabel}
        </div>
      `;
    }).join('');
    $('#calGrid').innerHTML = html;
  }

  // ================= MEETING DETAIL =================
  const STATUS_LABEL = {waiting:'대기', inprogress:'진행중', overdue:'지연', done:'완료'};

  function computeStatus(issue){
    if(issue.status === '완료') return 'done';
    if(issue.dueDate && todayISO() > issue.dueDate) return 'overdue';
    if(issue.status === '진행중') return 'inprogress';
    return 'waiting';
  }
  function computeProgressPct(issue){
    if(!issue.startDate || !issue.dueDate) return issue.status === '완료' ? 100 : 0;
    const start = new Date(issue.startDate).getTime();
    const due = new Date(issue.dueDate).getTime();
    const today = new Date(todayISO()).getTime();
    if(due <= start) return 100;
    return Math.max(0, Math.min(100, ((today - start) / (due - start)) * 100));
  }

    $('#categoryTabs').innerHTML = tabs.map(c => `<button class="tab ${state.filterCat === c.id ? 'on' : ''}" data-cat="${c.id}">${escapeHtml(c.name)}</button>`).join('');

  function renderAssigneeFilter(){

    sel.innerHTML = `<option value="all">담당자 전체</option>` + names.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
    sel.value = names.includes(current) ? current : 'all';

  function getFilteredSorted(){
    let items = getIssuesForMeeting(state.currentMeeting);
    if(state.filterCat !== 'all') items = items.filter(i => i.categoryId === state.filterCat);
    if(state.filterAssignee !== 'all') items = items.filter(i => (i.assignees || []).includes(state.filterAssignee));
    if(state.hideDone) items = items.filter(i => i.status !== '완료');
    const [key, dir] = state.sort.split('-');
    items.sort((a,b) => {
      const av = key === 'due' ? (a.dueDate || '9999') : (a.startDate || '9999');
      const bv = key === 'due' ? (b.dueDate || '9999') : (b.startDate || '9999');
      return dir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    });
    return items;
  }

  async function saveIssueFromDrawer(){
    const wasNew = !editingId;
    const title = $('#titleInput').value.trim();
    const assignees = [...pickedAssignees];
    const status = pickedStatus;
    const startDate = $('#startInput').value;
    const dueDate = $('#dueInput').value;
    const doneDate = $('#doneInput').value;
    if(!title){ $('#titleInput').focus(); return; }
    if(!pickedCategoryId && state.categories[0]) pickedCategoryId = state.categories[0].id;

    let newId = null;
    if(editingId){
      const idx = state.issues.findIndex(i => i.id === editingId);
      if(idx !== -1) state.issues[idx] = {...state.issues[idx], categoryId: pickedCategoryId, title, assignees, status, startDate, dueDate, doneDate};
    } else {
      newId = uid();
      state.issues.push({
        id: newId, categoryId: pickedCategoryId, title, assignees, status, startDate, dueDate, doneDate,
        linkedMeetings: state.currentMeeting ? [state.currentMeeting] : [],
        thread: [],
      });
    }
    await saveIssues();
    closeDrawer();

    if(wasNew && newId){
      openIssueThread(newId);
    } else if(state.view === 'thread'){
      renderThreadView();
    } else {
      renderMeetingView();
    }
  }

  // ================= RICH TEXT TOOLBARS (shared) =================
  function bindRTEButton(btnId, editorId, command, arg){
    const btn = $('#' + btnId);
    if(!btn) return;
    btn.addEventListener('click', () => {
      $('#' + editorId).focus();
      document.execCommand(command, false, arg);
    });
  }
  function bindLinkButton(btnId, editorId){
    const btn = $('#' + btnId);
    if(!btn) return;
    btn.addEventListener('click', () => {
      const url = prompt('연결할 링크 주소를 입력하세요 (예: https://example.com)');
      if(!url) return;
      $('#' + editorId).focus();
      document.execCommand('createLink', false, url);
    });
  }
  function bindInlineCodeButton(btnId, editorId){
    const btn = $('#' + btnId);
    if(!btn) return;
    btn.addEventListener('click', () => {
      const editor = $('#' + editorId);
      editor.focus();
      const sel = window.getSelection();
      if(!sel.rangeCount) return;
      const range = sel.getRangeAt(0);
      if(!editor.contains(range.commonAncestorContainer)) return;
      const codeEl = document.createElement('code');
      if(range.collapsed){
        codeEl.textContent = '코드';
        range.insertNode(codeEl);
        const newRange = document.createRange();
        newRange.selectNodeContents(codeEl);
        sel.removeAllRanges();
        sel.addRange(newRange);
      } else {
        const content = range.extractContents();
        codeEl.appendChild(content);
        range.insertNode(codeEl);
      }
    });
  }
  function setupRTEToolbar(prefix, editorId){
    bindRTEButton(prefix + 'Bold', editorId, 'bold');
    bindRTEButton(prefix + 'Italic', editorId, 'italic');
    bindRTEButton(prefix + 'Underline', editorId, 'underline');
    bindRTEButton(prefix + 'Strike', editorId, 'strikeThrough');
    bindLinkButton(prefix + 'Link', editorId);
    bindRTEButton(prefix + 'Bullet', editorId, 'insertUnorderedList');
    bindRTEButton(prefix + 'Ordered', editorId, 'insertOrderedList');
    bindRTEButton(prefix + 'Quote', editorId, 'formatBlock', '<blockquote>');
    bindInlineCodeButton(prefix + 'Code', editorId);
    bindRTEButton(prefix + 'Codeblock', editorId, 'formatBlock', '<pre>');
  }

  $('#backBtn').addEventListener('click', backToHome);
  $('#threadBackBtn').addEventListener('click', backToMeetingFromThread);

  $('#modeTableBtn').addEventListener('click', () => { state.homeMode='table'; $('#modeTableBtn').classList.add('on'); $('#modeCalendarBtn').classList.remove('on'); renderHome(); });
  $('#modeCalendarBtn').addEventListener('click', () => { state.homeMode='calendar'; $('#modeCalendarBtn').classList.add('on'); $('#modeTableBtn').classList.remove('on'); renderHome(); });

  $('#addMeetingBtn').addEventListener('click', async () => {
    const val = $('#newMeetingDate').value;
    if(!val) return;
    const time = $('#newMeetingTime').value || '10:30';
    if(!state.meetings.includes(val)){ state.meetings.push(val); await saveMeetings(); }
    state.meetingTimes[val] = time;
    await saveMeetingTimes();
    $('#newMeetingDate').value = '';
    openMeeting(val);
  });

  $('#meetingTimeInput').addEventListener('change', async (e) => {
    if(!state.currentMeeting) return;
    state.meetingTimes[state.currentMeeting] = e.target.value || '10:30';
    await saveMeetingTimes();
    renderMeetingTable();
  });

  $('#meetingList').addEventListener('click', (e) => {
    const row = e.target.closest('.meeting-row');
    if(!row) return;
    openMeeting(row.getAttribute('data-date'));
  });

  $('#calGrid').addEventListener('click', (e) => {
    const cell = e.target.closest('.cal-cell');
    if(!cell) return;
    openMeeting(cell.getAttribute('data-date'));
  });

  $('#calPrev').addEventListener('click', () => {
    state.calMonth--; if(state.calMonth < 0){ state.calMonth = 11; state.calYear--; }
    renderCalendar();
  });
  $('#calNext').addEventListener('click', () => {
    state.calMonth++; if(state.calMonth > 11){ state.calMonth = 0; state.calYear++; }
    renderCalendar();
  });

  $('#openAddBtn').addEventListener('click', () => openDrawer(null));
  $('#emptyAddBtn').addEventListener('click', () => openDrawer(null));
  $('#closeDrawer').addEventListener('click', closeDrawer);
  $('#cancelBtn').addEventListener('click', closeDrawer);
  $('#scrim').addEventListener('click', closeAllOverlays);
  $('#saveBtn').addEventListener('click', saveIssueFromDrawer);
  $('#deleteBtn').addEventListener('click', deleteIssue);
  $('#addAssigneeBtn').addEventListener('click', addAssignee);
  $('#newAssigneeName').addEventListener('keydown', (e) => { if(e.key==='Enter'){ e.preventDefault(); addAssignee(); }});

  $('#catPicker').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-catpick]');
    if(!btn) return;
    pickedCategoryId = btn.getAttribute('data-catpick');
    renderCatPicker();
  });

  $('#assigneePicker').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-assignpick]');
    if(!btn) return;
    const name = btn.getAttribute('data-assignpick');
    const i = pickedAssignees.indexOf(name);
    if(i === -1) pickedAssignees.push(name); else pickedAssignees.splice(i, 1);
    renderAssigneePicker();
  });

  $('#statusPicker').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-statuspick]');
    if(!btn) return;
    pickedStatus = btn.getAttribute('data-statuspick');
    renderStatusPicker();
  });

  let noteEditingId = null;

  function renderMeetingNoteList(){
    const entries = (state.meetingNotes[state.currentMeeting] || []).slice().sort((a,b) => (a.createdAt||'').localeCompare(b.createdAt||''));
    $('#notesCountLabel').textContent = entries.length ? `(${entries.length})` : '';
    $('#meetingNoteList').innerHTML = entries.length ? entries.map(entry => `
      <div class="thread-entry" data-note-id="${entry.id}">
        <div class="thread-entry-head">
          <span>${new Date(entry.createdAt).toLocaleString('ko-KR', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'})}</span>
          ${entry.editedAt ? `<span class="edited-label">(수정됨)</span>` : ''}
          <button class="edit-entry" data-edit-note="${entry.id}" title="수정">✎</button>
          <button class="del-entry" data-del-note="${entry.id}" title="삭제">✕</button>
        </div>
        <div class="thread-entry-body">${entry.body}</div>
      </div>
    `).join('') : `<div class="thread-empty">아직 메모가 없어요. 아래에 적어보세요.</div>`;

    noteEditingId = null;
    $('#noteCancelEditBtn').style.display = 'none';
    $('#meetingNotePostBtn').textContent = '게시';
    $('#meetingNoteEditor').innerHTML = '';
  }

  function editMeetingNote(noteId){
    const entry = (state.meetingNotes[state.currentMeeting] || []).find(e => e.id === noteId);
    if(!entry) return;
    noteEditingId = noteId;
    $('#meetingNoteEditor').innerHTML = entry.body;
    $('#meetingNoteEditor').focus();
    $('#noteCancelEditBtn').style.display = '';
    $('#meetingNotePostBtn').textContent = '수정 완료';
  }

  function cancelMeetingNoteEdit(){
    noteEditingId = null;
    $('#meetingNoteEditor').innerHTML = '';
    $('#noteCancelEditBtn').style.display = 'none';
    $('#meetingNotePostBtn').textContent = '게시';
  }

  async function postMeetingNote(){
    if(!state.currentMeeting) return;
    const html = $('#meetingNoteEditor').innerHTML.trim();
    if(!htmlToPlainText(html)) return;
    if(!Array.isArray(state.meetingNotes[state.currentMeeting])) state.meetingNotes[state.currentMeeting] = [];
    if(noteEditingId){
      const entry = state.meetingNotes[state.currentMeeting].find(e => e.id === noteEditingId);
      if(entry){ entry.body = html; entry.editedAt = new Date().toISOString(); }
    } else {
      state.meetingNotes[state.currentMeeting].push({ id: uid(), createdAt: new Date().toISOString(), body: html });
    }
    await saveMeetingNotes();
    renderMeetingNoteList();
  }

  async function deleteMeetingNote(noteId){
    if(!state.currentMeeting) return;
    state.meetingNotes[state.currentMeeting] = (state.meetingNotes[state.currentMeeting] || []).filter(e => e.id !== noteId);
    await saveMeetingNotes();
    renderMeetingNoteList();
  }

  $('#meetingNotePostBtn').addEventListener('click', postMeetingNote);
  $('#noteCancelEditBtn').addEventListener('click', cancelMeetingNoteEdit);
  $('#meetingNoteList').addEventListener('click', (e) => {
    const edit = e.target.closest('[data-edit-note]');
    if(edit){ editMeetingNote(edit.getAttribute('data-edit-note')); return; }
    const del = e.target.closest('[data-del-note]');
    if(del) deleteMeetingNote(del.getAttribute('data-del-note'));
  });

  $('#notesToggleBtn').addEventListener('click', () => {
    $('#notesToggleBtn').classList.toggle('collapsed');
    $('#notesBody').classList.toggle('collapsed');
  });

  $('#categoryTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-cat]');
    if(!btn) return;
    state.filterCat = btn.getAttribute('data-cat');
    renderCategoryTabs();
    renderIssueList();
  });

  $('#assigneeFilter').addEventListener('change', (e) => { state.filterAssignee = e.target.value; renderIssueList(); });
  $('#hideDone').addEventListener('change', (e) => { state.hideDone = e.target.checked; renderIssueList(); });
  $('#sortSelect').addEventListener('change', (e) => { state.sort = e.target.value; renderIssueList(); });

  $('#itemModeToggleBtn').addEventListener('click', () => {
    state.itemMode = 'toggle';
    $('#itemModeToggleBtn').classList.add('on');
    $('#itemModeTableBtn').classList.remove('on');
    renderIssueList();
  });
  $('#itemModeTableBtn').addEventListener('click', () => {
    state.itemMode = 'table';
    $('#itemModeTableBtn').classList.add('on');
    $('#itemModeToggleBtn').classList.remove('on');
    renderIssueList();
  });

  $('#list').addEventListener('click', (e) => {
    const metaBtn = e.target.closest('[data-meta]');
    if(metaBtn){
      const issue = state.issues.find(i => i.id === metaBtn.getAttribute('data-meta'));
      if(issue) openDrawer(issue);
      return;
    }
    const threadBtn = e.target.closest('[data-thread]');
    if(threadBtn){
      openIssueThread(threadBtn.getAttribute('data-thread'));
      return;
    }
    const summary = e.target.closest('[data-toggle]');
    if(summary){
      const id = summary.getAttribute('data-toggle');
      if(state.expandedIds.has(id)) state.expandedIds.delete(id); else state.expandedIds.add(id);
      renderIssueCards();
      return;
    }
    const tableRow = e.target.closest('tr[data-id]');
    if(tableRow){
      openIssueThread(tableRow.getAttribute('data-id'));
    }
  });

  $('#linkIssueBtn').addEventListener('click', openLinkPanel);
  $('#closeLinkPanel').addEventListener('click', closeLinkPanel);
  $('#linkPanelList').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-link-issue]');
    if(!btn) return;
    linkExistingIssue(btn.getAttribute('data-link-issue'));
  });

  $('#threadEditBtn').addEventListener('click', () => {
    const issue = state.issues.find(i => i.id === state.currentIssueId);
    if(issue) openDrawer(issue);
  });
  $('#threadStatusTag').addEventListener('click', cycleThreadStatus);
  $('#threadPostBtn').addEventListener('click', postThreadEntry);
  $('#threadCancelEditBtn').addEventListener('click', cancelThreadEdit);
  $('#threadList').addEventListener('click', (e) => {
    const edit = e.target.closest('[data-edit-entry]');
    if(edit){ editThreadEntry(edit.getAttribute('data-edit-entry')); return; }
    const del = e.target.closest('[data-del-entry]');
    if(del) deleteThreadEntry(del.getAttribute('data-del-entry'));
  });
  $('#threadLinkedMeetings').addEventListener('click', (e) => {
    const chip = e.target.closest('[data-gomeeting]');
    if(chip) openMeeting(chip.getAttribute('data-gomeeting'));
  });

  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeAllOverlays(); });

  loadState();
})();
</script>
</body>
</html>
